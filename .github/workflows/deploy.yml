name: Publier l'application sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Droits nécessaires au déploiement Pages (jeton éphémère fourni par GitHub).
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois, sans annuler celui en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Construire l'application
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire l'application
        run: npm run build

      - name: Activer et préparer GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Téléverser le dossier dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Déployer sur GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer l'artefact
        id: deployment
        uses: actions/deploy-pages@v4
